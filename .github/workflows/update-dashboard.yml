name: Actualizar visor fuego

on:
  workflow_dispatch:
  schedule:
    # Objetivos: 04:30 y 12:30 Europe/Madrid.
    # GitHub puede retrasar o descartar eventos schedule; por eso se añaden
    # tres respaldos por franja en minutos distintos y alejados del inicio de hora.
    - cron: "30 4,12 * * *"
      timezone: "Europe/Madrid"
    - cron: "47 4,12 * * *"
      timezone: "Europe/Madrid"
    - cron: "13 5,13 * * *"
      timezone: "Europe/Madrid"
    - cron: "41 5,13 * * *"
      timezone: "Europe/Madrid"

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar-visor-fuego
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  R_KEEP_PKG_SOURCE: no
  MAKEFLAGS: -j2

jobs:
  schedule-gate:
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      reason: ${{ steps.gate.outputs.reason }}
      slot: ${{ steps.gate.outputs.slot }}

    steps:
      - name: Decidir si debe ejecutarse el pipeline
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPR: ${{ github.event.schedule }}
          PAGES_BASE_URL: https://santiagomota.github.io/visor-fuego
        run: |
          set -euo pipefail

          madrid_now=$(TZ=Europe/Madrid date '+%Y-%m-%d %H:%M:%S %Z')
          madrid_date=$(TZ=Europe/Madrid date '+%Y-%m-%d')
          madrid_hm=$(TZ=Europe/Madrid date '+%H:%M')
          echo "Evento: $EVENT_NAME"
          echo "Hora Madrid: $madrid_now"
          echo "Expresión schedule: ${SCHEDULE_EXPR:-manual}"

          # Las ejecuciones manuales siempre ejecutan el pipeline completo.
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=ejecución manual" >> "$GITHUB_OUTPUT"
            echo "slot=manual" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # La entrada principal de cada franja siempre intenta actualizar.
          if [ "$SCHEDULE_EXPR" = "30 4,12 * * *" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=ejecución principal programada" >> "$GITHUB_OUTPUT"
            echo "slot=$madrid_hm" >> "$GITHUB_OUTPUT"
            echo "Ejecución principal $madrid_hm: se ejecutará el pipeline completo."
            exit 0
          fi

          # Los respaldos se agrupan por objetivo de actualización.
          case "$SCHEDULE_EXPR" in
            "47 4,12 * * *")
              if [ "${madrid_hm%%:*}" -lt 10 ]; then target_hm="04:30"; else target_hm="12:30"; fi
              ;;
            "13 5,13 * * *"|"41 5,13 * * *")
              if [ "${madrid_hm%%:*}" -lt 10 ]; then target_hm="04:30"; else target_hm="12:30"; fi
              ;;
            *)
              echo "::warning::Schedule no reconocido: $SCHEDULE_EXPR. Se ejecutará por seguridad."
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "reason=schedule no reconocido; ejecución por seguridad" >> "$GITHUB_OUTPUT"
              echo "slot=$madrid_hm" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          target_epoch=$(TZ=Europe/Madrid date -d "$madrid_date $target_hm:00" +%s)
          bust=$(date -u +%s)
          manifest=$(mktemp)
          url="${PAGES_BASE_URL%/}/assets/site-build.json?gate=$bust"

          echo "Respaldo $madrid_hm para objetivo $target_hm."
          echo "Comprobando el build realmente publicado en: $url"

          if curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            -H 'Cache-Control: no-cache, no-store, max-age=0' \
            "$url" -o "$manifest"; then
            published_at=$(jq -r '.generated_at_utc // empty' "$manifest" 2>/dev/null || true)
            build_id=$(jq -r '.build_id // empty' "$manifest" 2>/dev/null || true)
          else
            published_at=""
            build_id=""
          fi

          if [ -n "$published_at" ] && published_epoch=$(date -u -d "$published_at" +%s 2>/dev/null); then
            echo "Build público: ${build_id:-s/d}"
            echo "Generado UTC: $published_at"
            if [ "$published_epoch" -ge "$target_epoch" ]; then
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "reason=respaldo omitido: Pages ya contiene un build posterior al objetivo $target_hm" >> "$GITHUB_OUTPUT"
              echo "slot=$madrid_hm" >> "$GITHUB_OUTPUT"
              echo "Pages ya está actualizado para la franja $target_hm; no se repite el pipeline."
              exit 0
            fi
          fi

          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "reason=respaldo activado: Pages no contiene un build posterior al objetivo $target_hm" >> "$GITHUB_OUTPUT"
          echo "slot=$madrid_hm" >> "$GITHUB_OUTPUT"
          echo "::warning::La web aún no está actualizada para $target_hm; se ejecutará el pipeline completo."

      - name: Resumen de decisión
        run: |
          echo "should_run=${{ steps.gate.outputs.should_run }}"
          echo "slot=${{ steps.gate.outputs.slot }}"
          echo "reason=${{ steps.gate.outputs.reason }}"

  update-dashboard:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Los eventos programados solo se ejecutan sobre la rama predeterminada.
          # En las ejecuciones manuales usamos también esa rama para publicar siempre
          # en el mismo destino.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Preflight de fuente v0.6.26
        run: |
          set -euo pipefail
          echo "Commit checkout: $(git rev-parse HEAD)"
          echo "Versión declarada: $(awk -F': ' '$1=="Version" {print $2}' DESCRIPTION)"
          echo "SHA256 index.qmd: $(sha256sum index.qmd | awk '{print $1}')"
          echo "SHA256 sw.js: $(sha256sum sw.js | awk '{print $1}')"
          cache_required=(
            "navigator.serviceWorker.register"
            "updateViaCache: \"none\""
            "VISOR_FUEGO_SW_VERSION = \"0.6.25\""
          )
          for marker in "${cache_required[@]}"; do
            if ! grep -Fq "$marker" browser-cache.html sw.js; then
              echo "::error::Falta el control de caché v0.6.26: $marker"
              exit 1
            fi
          done
          required=(
            "async function loadRuntimeData()"
            "fetchJsonNoStore('assets/aemet/layers.json')"
            "cache: 'no-store'"
            "Cargando datos actuales"
          )
          for marker in "${required[@]}"; do
            if ! grep -Fq "$marker" index.qmd; then
              echo "::error::El checkout NO contiene el index.qmd runtime v0.6.26. Falta: $marker"
              echo "::error::No se instalará R ni se publicará un snapshot antiguo."
              exit 1
            fi
          done
          if grep -Fq "const layers = __LAYERS_JSON__;" index.qmd; then
            echo "::error::El checkout contiene el index.qmd antiguo con catálogo AEMET embebido."
            exit 1
          fi
          grep -n -F "async function loadRuntimeData()" index.qmd | head -1
          grep -n -F "fetchJsonNoStore('assets/aemet/layers.json')" index.qmd | head -1
          echo "Preflight runtime v0.6.26 OK."

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Mostrar motivo y horario de ejecución
        run: |
          echo "Evento: $GITHUB_EVENT_NAME"
          echo "Tipo de ejecución: ${{ needs.schedule-gate.outputs.reason }}"
          echo "Franja: ${{ needs.schedule-gate.outputs.slot }}"
          echo "Rama de publicación: ${{ github.event.repository.default_branch }}"
          echo "Hora UTC: $(date -u '+%Y-%m-%d %H:%M:%S %Z')"
          echo "Hora Madrid: $(TZ=Europe/Madrid date '+%Y-%m-%d %H:%M:%S %Z')"

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Preparar librería R de usuario
        run: |
          mkdir -p "$RUNNER_TEMP/Rlib"
          echo "R_LIBS_USER=$RUNNER_TEMP/Rlib" >> "$GITHUB_ENV"
          echo "R_LIBS=$RUNNER_TEMP/Rlib" >> "$GITHUB_ENV"
          echo "R_LIBS_SITE=/usr/local/lib/R/site-library:/usr/lib/R/site-library:/usr/lib/R/library" >> "$GITHUB_ENV"

      - name: Instalar R, librerías geoespaciales y paquetes apt disponibles
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            r-base r-base-dev \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev \
            gdal-bin proj-bin pandoc ca-certificates

          apt_pkgs=(
            r-cran-curl r-cran-jsonlite r-cran-readr r-cran-dplyr r-cran-purrr
            r-cran-stringr r-cran-tibble r-cran-fs r-cran-glue r-cran-tidyr
            r-cran-httr2 r-cran-xml2 r-cran-lubridate r-cran-sf r-cran-terra
            r-cran-stars r-cran-units r-cran-lwgeom r-cran-htmltools
            r-cran-htmlwidgets r-cran-rmarkdown r-cran-knitr r-cran-yaml
            r-cran-dt r-cran-plotly r-cran-ggplot2 r-cran-png r-cran-scales
            r-cran-digest r-cran-base64enc r-cran-here r-cran-cli
            r-cran-sp r-cran-raster r-cran-magrittr r-cran-markdown
            r-cran-viridislite r-cran-rcolorbrewer r-cran-crosstalk r-cran-jquerylib
            r-cran-remotes
          )

          for pkg in "${apt_pkgs[@]}"; do
            if apt-cache show "$pkg" >/dev/null 2>&1; then
              sudo apt-get install -y --no-install-recommends "$pkg"
            else
              echo "::warning::Paquete apt no disponible: $pkg; se intentará desde CRAN si hace falta"
            fi
          done

      - name: Instalar paquetes R restantes desde CRAN en librería de usuario
        run: |
          cat > /tmp/install_required_packages.R <<'RSCRIPT'
          required <- c(
            "curl", "jsonlite", "readr", "dplyr", "purrr", "stringr", "tibble",
            "fs", "glue", "tidyr", "httr2", "xml2", "lubridate", "sf", "terra",
            "stars", "units", "lwgeom", "leaflet", "leaflet.providers", "htmltools",
            "htmlwidgets", "rmarkdown", "knitr", "yaml", "DT", "plotly", "ggplot2",
            "png", "scales", "digest", "base64enc", "here", "cli",
            "sp", "raster", "magrittr", "markdown", "viridisLite", "RColorBrewer",
            "crosstalk", "jquerylib"
          )

          user_lib <- Sys.getenv("R_LIBS_USER", unset = file.path(Sys.getenv("RUNNER_TEMP"), "Rlib"))
          dir.create(user_lib, recursive = TRUE, showWarnings = FALSE)
          .libPaths(unique(c(user_lib, .libPaths())))

          message("R_LIBS_USER=", user_lib)
          print(.libPaths())
          options(repos = c(CRAN = "https://cloud.r-project.org"))

          is_available <- function(pkg) {
            suppressWarnings(requireNamespace(pkg, quietly = TRUE))
          }

          missing <- required[!vapply(required, is_available, logical(1))]
          message("Paquetes faltantes antes de CRAN: ", if (length(missing)) paste(missing, collapse = ", ") else "ninguno")

          leaflet_pkgs <- c("leaflet.providers", "leaflet")
          non_leaflet_missing <- setdiff(missing, leaflet_pkgs)

          if (length(non_leaflet_missing)) {
            install.packages(
              non_leaflet_missing,
              lib = user_lib,
              dependencies = c("Depends", "Imports", "LinkingTo"),
              Ncpus = 2
            )
          }

          if (!is_available("leaflet.providers")) {
            install.packages("leaflet.providers", lib = user_lib, dependencies = FALSE, Ncpus = 2)
          }

          if (!is_available("leaflet")) {
            install.packages("leaflet", lib = user_lib, dependencies = FALSE, Ncpus = 2)
          }

          missing2 <- required[!vapply(required, is_available, logical(1))]
          if (length(missing2)) {
            message("Paquetes R que siguen faltando tras la instalación:")
            print(missing2)
            sessionInfo()
            quit(status = 1)
          }

          message("Todos los paquetes R requeridos están disponibles.")
          RSCRIPT

          Rscript /tmp/install_required_packages.R

      - name: Diagnóstico de entorno
        run: |
          R --version
          quarto --version
          gdalinfo --version
          Rscript - <<'RSCRIPT'
          message("R_LIBS_USER=", Sys.getenv("R_LIBS_USER"))
          print(.libPaths())
          pkgs <- c("sf", "terra", "raster", "leaflet", "leaflet.providers", "htmlwidgets", "dplyr", "readr")
          for (p in pkgs) {
            suppressPackageStartupMessages(library(p, character.only = TRUE))
            cat(p, as.character(packageVersion(p)), "\n")
          }
          sessionInfo()
          RSCRIPT

      - name: Configurar variables del visor
        env:
          CARTO_BASEMAP_KEY: ${{ secrets.CARTO_BASEMAP_KEY }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          cat > .Renviron <<'EOF'
          AEMET_PROVIDER=classic
          AEMET_CLASSIC_VALID_START_OFFSET_DAYS=0
          AEMET_CLASSIC_KEEP_LATEST_ISSUE_ONLY=true
          AEMET_CLASSIC_CLEAN_RAW_BEFORE_INSTALL=true
          AEMET_CLASSIC_PREFER_TODAY_ISSUE=true
          AEMET_CLASSIC_RETRIES=3
          AEMET_CLASSIC_RETRY_SECONDS=45
          AEMET_CLASSIC_MAX_ISSUE_AGE_DAYS=1
          AEMET_REQUIRE_OFFICIAL_STYLE=true
          AEMET_HIDE_PAST_VALID_DATES=true
          AEMET_INCLUDE_ORPHAN_RAW=false
          AEMET_CLEAN_WEB_ASSETS=true

          EFFIS_ENABLE=false
          EFFIS_RENDER_MODE=disabled
          EFFIS_BA_ENABLE=true
          EFFIS_BA_OPTIONAL=true
          EFFIS_BA_BBOX=-19,27,5,44.6
          EFFIS_BA_MAX_DAYS=90
          EFFIS_BA_MIN_AREA_HA=5
          EFFIS_BA_SIMPLIFY_M=100

          FIRMS_SOURCES=VIIRS_SNPP_NRT,VIIRS_NOAA20_NRT
          FIRMS_DAYS=2
          FIRMS_BBOX=-19,27,5,44.6
          FIRMS_PRESERVE_LAST_ON_EMPTY=true
          FIRMS_MAX_PRESERVED_AGE_HOURS=72

          UPDATE_ADMIN_BOUNDARIES=false
          HISTORY_KEEP_DAYS=90
          HISTORY_MODE=daily_latest
          EOF

          # Las claves se escriben desde variables de entorno para evitar
          # interpretación accidental de caracteres especiales por el shell.
          printf 'CARTO_BASEMAP_KEY=%s\n' "$CARTO_BASEMAP_KEY" >> .Renviron
          printf 'FIRMS_MAP_KEY=%s\n' "$FIRMS_MAP_KEY" >> .Renviron

          if [ -z "$CARTO_BASEMAP_KEY" ]; then
            echo "::error::Falta el secret CARTO_BASEMAP_KEY. Configúralo en Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Verificar arquitectura runtime antes del pipeline
        run: |
          set -euo pipefail
          required=(
            "async function loadRuntimeData()"
            "fetchJsonNoStore('assets/aemet/layers.json')"
            "cache: 'no-store'"
            "Cargando datos actuales"
          )
          for marker in "${required[@]}"; do
            if ! grep -Fq "$marker" index.qmd; then
              echo "::error::index.qmd no contiene la arquitectura dinámica requerida: $marker"
              exit 1
            fi
          done
          if grep -Fq "const layers = __LAYERS_JSON__;" index.qmd; then
            echo "::error::index.qmd sigue usando el catálogo AEMET embebido antiguo."
            exit 1
          fi
          if grep -Fq "applyRuntimeAemetLayers(embeddedLayers" index.qmd; then
            echo "::error::index.qmd conserva un fallback AEMET embebido que puede mostrar fechas obsoletas."
            exit 1
          fi
          echo "Arquitectura runtime AEMET verificada antes del pipeline."

      - name: Actualizar datos y validar entradas
        run: |
          set -euo pipefail
          Rscript scripts/99_run_all.R

      - name: Renderizar sitio desde cero
        run: |
          set -euo pipefail
          # Los datos operativos cambian sin modificar necesariamente los QMD.
          # Eliminamos cualquier resultado congelado y el docs/ anterior para
          # garantizar que el artefacto se construye con el snapshot actual.
          rm -rf _freeze docs
          quarto render

          test -s docs/sw.js || {
            echo "::error::Quarto no publicó docs/sw.js"
            exit 1
          }
          grep -Fq "navigator.serviceWorker.register" docs/index.html || {
            echo "::error::docs/index.html no registra el service worker v0.6.26"
            exit 1
          }
          grep -Fq 'VISOR_FUEGO_SW_VERSION = "0.6.26"' docs/sw.js || {
            echo "::error::docs/sw.js no corresponde a v0.6.26"
            exit 1
          }
          grep -Fq 'VISOR_FUEGO_SCOPE_PATH = "/visor-fuego/"' docs/sw.js || {
            echo "::error::docs/sw.js no tiene el scope absoluto esperado."
            exit 1
          }

      - name: Validar sitio publicado
        run: |
          set -euo pipefail
          Rscript scripts/11_check_published_assets.R
          if ! grep -q "basemaps.cartocdn.com" docs/index.html; then
            echo "::error::El HTML renderizado no contiene el basemap CARTO. Revisa CARTO_BASEMAP_KEY."
            exit 1
          fi
          for marker in "loadRuntimeData" "assets/aemet/layers.json" "runtime-source-status"; do
            if ! grep -Fq "$marker" docs/index.html; then
              echo "::error::docs/index.html no contiene el runtime dinámico esperado: $marker"
              exit 1
            fi
          done
          echo "HTML runtime verificado: AEMET se cargará desde assets/ en el navegador."

      # El sitio se publica antes de cualquier operación de escritura en Git.
      # De este modo un conflicto al guardar snapshots de datos no puede impedir
      # que GitHub Pages reciba un render ya validado.
      - name: Subir artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Desplegar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verificar build servido por GitHub Pages
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail

          expected=$(jq -r '.build_id // empty' assets/site-build.json)
          if [ -z "$expected" ]; then
            echo "::error::assets/site-build.json no contiene build_id"
            exit 1
          fi

          if [ -z "${PAGE_URL:-}" ]; then
            echo "::error::deploy-pages no devolvió page_url"
            exit 1
          fi

          base="${PAGE_URL%/}"
          echo "Build esperado: $expected"
          echo "URL Pages: $base/"

          matched=false
          for intento in $(seq 1 18); do
            bust="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${intento}-$(date +%s)"
            remote_manifest=$(mktemp)
            remote_html=$(mktemp)

            manifest_ok=false
            html_ok=false

            if curl --fail --silent --show-error --location \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              "$base/assets/site-build.json?build=$bust" -o "$remote_manifest"; then
              remote=$(jq -r '.build_id // empty' "$remote_manifest" 2>/dev/null || true)
              if [ "$remote" = "$expected" ]; then
                manifest_ok=true
              fi
            fi

            if curl --fail --silent --show-error --location \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              "$base/index.html?build=$bust" -o "$remote_html"; then
              if grep -Fq "$expected" "$remote_html"; then
                html_ok=true
              fi
            fi

            rm -f "$remote_manifest" "$remote_html"

            echo "Verificación $intento: manifest=$manifest_ok html=$html_ok"
            if [ "$manifest_ok" = "true" ] && [ "$html_ok" = "true" ]; then
              matched=true
              break
            fi
            sleep 10
          done

          if [ "$matched" != "true" ]; then
            echo "::error::GitHub Pages no está sirviendo el build $expected tras el despliegue."
            echo "::error::La ejecución se marca como fallida para no ocultar un HTML o un manifiesto obsoletos."
            exit 1
          fi

          sw_ok=false
          sw_bust="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-sw-$(date +%s)"
          remote_sw=$(mktemp)
          if curl --fail --silent --show-error --location             -H 'Cache-Control: no-cache, no-store, max-age=0'             "$base/sw.js?build=$sw_bust" -o "$remote_sw"; then
            if grep -Fq 'VISOR_FUEGO_SW_VERSION = "0.6.26"' "$remote_sw"; then
              sw_ok=true
            fi
          fi
          rm -f "$remote_sw"
          if [ "$sw_ok" != "true" ]; then
            echo "::error::GitHub Pages no está sirviendo sw.js v0.6.26."
            exit 1
          fi

          echo "GitHub Pages sirve correctamente el build $expected y sw.js v0.6.26."

      - name: Guardar datos generados en Git
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Solo versionamos datos y assets. docs/ contiene el render público con
          # la URL de CARTO y se distribuye exclusivamente como artefacto de Pages.
          git add -A -- data/processed assets

          if git diff --cached --quiet; then
            echo "No hay cambios de datos que confirmar."
            exit 0
          fi

          git commit -m "Actualiza datos del visor automáticamente"

          # Quarto acaba de regenerar docs/. Como docs/ no forma parte del commit,
          # esas modificaciones quedan sin preparar y Git no permite hacer rebase
          # con un árbol de trabajo sucio. El artefacto ya está desplegado, por lo
          # que podemos devolver docs/ al estado del checkout antes de integrar Git.
          git restore --worktree -- docs || true
          git clean -fd -- docs || true

          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "::warning::Quedan cambios rastreados fuera de assets/ y data/processed; se omite el push automático para no sobrescribir trabajo ajeno."
            git status --short
            exit 0
          fi

          publicado=false
          for intento in 1 2 3; do
            echo "Intento de guardado en Git $intento de 3"
            git fetch origin "$TARGET_BRANCH"

            if ! git rebase "origin/$TARGET_BRANCH"; then
              git rebase --abort || true
              echo "::warning::No se pudieron integrar automáticamente cambios remotos. GitHub Pages ya ha sido desplegado; el snapshot Git se reintentará en la próxima ejecución."
              exit 0
            fi

            if git push origin "HEAD:$TARGET_BRANCH"; then
              echo "Datos guardados correctamente en Git."
              publicado=true
              break
            fi

            sleep $((intento * 5))
          done

          if [ "$publicado" != "true" ]; then
            echo "::warning::No se pudo guardar el snapshot de datos después de tres intentos. GitHub Pages ya está desplegado y el siguiente workflow volverá a intentarlo."
          fi
